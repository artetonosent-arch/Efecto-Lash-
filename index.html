(atob(h.split(\"cfg=\")[1]));localStorage.setItem(CFG_KEY,JSON.stringify(o));history.replaceState(null,\"\",location.pathname+location.search+\"#panel\");return o}\n  return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return {}}}\nconst CONFIG = Object.assign({ firebaseUrl:\"\", apiKey:\"\", authDomain:\"\" }, cfgLoad());\nconst SERV = [\n [\"clasicas\",\"Clásicas\",550,\"Pestañas\",120],[\"rimel\",\"Efecto rímel\",550,\"Pestañas\",120],[\"mojado\",\"Efecto mojado\",580,\"Pestañas\",120],\n [\"hibridas\",\"Híbridas\",580,\"Pestañas\",120],[\"hawaiana\",\"Hawaiana Tech\",480,\"Pestañas\",150],[\"aura\",\"Aura 2D y 3D\",480,\"Pestañas\",150],\n [\"egipcias\",\"Egipcias Tech 3D y 4D\",480,\"Pestañas\",150],[\"mega\",\"Mega volumen tech 5D y 6D\",550,\"Pestañas\",150],[\"wispy\",\"Wispy 3D\",600,\"Pestañas\",150],\n [\"anime\",\"Anime 3D\",600,\"Pestañas\",150],[\"manga\",\"Manga\",650,\"Pestañas\",150],[\"lifting\",\"Lash lifting\",300,\"Lifting\",60],\n [\"promo\",\"Promo lifting (rizado + cejas HD)\",400,\"Lifting\",90],[\"cejashd\",\"Cejas HD\",150,\"Cejas\",30],[\"brow\",\"Brow lamination\",300,\"Cejas\",60]\n].map(([id,nombre,precio,cat,duracion])=>({id,nombre,precio,cat,duracion,activo:true}));\nconst DEF_CFG = { servicios:SERV, apertura:\"10:00\", cierre:\"19:00\", dias:[1,2,3,4,5,6], paso:30, cerrados:[], whatsapp:\"\" };\nconst ESTADOS = [\"pendiente\",\"confirmada\",\"completada\",\"cancelada\"];\nconst EST_CLS = {pendiente:\"warn\",confirmada:\"\",completada:\"ok\",cancelada:\"bad\"};\n\n/* ---------- datos ---------- */\nconst slotKey=c=>\"h\"+String(c.hora).replace(\":\",\"\");\nconst LS=\"efectolash_v1\"; let mem={};\nfunction lsRead(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return mem}}\nfunction lsWrite(){try{localStorage.setItem(LS,JSON.stringify(mem))}catch(e){}}\nasync function fj(p,opt){const t=AUTH.on?await token():null;const r=await fetch(CONFIG.firebaseUrl+\"/\"+p+\".json\"+(t?\"?auth=\"+encodeURIComponent(t):\"\")
